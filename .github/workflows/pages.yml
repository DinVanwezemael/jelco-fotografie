name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate _projects/
        run: python3 scripts/generate_projects.py

      - name: Install Pillow
        run: pip install pillow

      # Enforces image weight for BOTH authoring pipelines, including CMS uploads that
      # arrive full-size from a phone. Rewrites the ephemeral checkout only — the
      # full-resolution originals stay untouched in git.
      - name: Optimize images
        run: python3 scripts/optimize_images.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Objective migration trigger: GitHub Pages caps a published site at 1 GB. Failing at
      # 80% gives us room to act (see "Hosting & when to migrate" in CLAUDE.md) instead of
      # discovering the ceiling when a deploy is rejected.
      - name: Check published site size
        run: |
          limit_kb=$((800 * 1024))
          size_kb=$(du -sk _site | cut -f1)
          echo "Published site size: $((size_kb / 1024)) MB (limit $((limit_kb / 1024)) MB)"
          if [ "$size_kb" -gt "$limit_kb" ]; then
            echo "::error::_site exceeds 80% of the GitHub Pages 1 GB cap. Time to migrate to Cloudflare Pages — see CLAUDE.md."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
